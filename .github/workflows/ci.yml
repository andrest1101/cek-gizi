name: CI

on:
  push:
    branches: [main, feature/app4-mvp]
  pull_request:
    branches: [main, feature/app4-mvp]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin ke SDK yang dipakai saat pengembangan agar hasil analisis
          # di CI identik dengan lokal (flaky lint karena drift versi).
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
